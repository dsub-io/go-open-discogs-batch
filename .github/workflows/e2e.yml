name: E2E

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discogs:
    name: Discogs data E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPEN_DISCOGS_TEST_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run dump-to-PostgreSQL end-to-end tests
        run: >-
          go test -tags=e2e
          -run '^TestBatchE2E$'
          -count=1
          ./src/batch

      - name: Remove owned test resources and verify no residue
        if: ${{ always() }}
        shell: bash
        run: scripts/verify-test-docker-cleanup.sh
