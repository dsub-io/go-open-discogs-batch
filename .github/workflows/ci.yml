name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  merge_group:
  schedule:
    - cron: '33 2 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'verification' }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'PR metadata' || 'Verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPEN_DISCOGS_TEST_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        run: python3 .github/scripts/classify_changes.py

      - name: Test CI routing
        if: steps.changes.outputs.ci == 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Validate workflows and release metadata
        if: steps.changes.outputs.ci == 'true'
        run: bash .github/scripts/check-workflows.sh

      - name: Set up Go
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify release policy
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq empty release-please-config.json
          for type in build chore ci docs refactor style test; do
            jq -e \
              --arg type "$type" \
              'any(.["changelog-sections"][]; .type == $type and .hidden == true)' \
              release-please-config.json >/dev/null
          done

      - name: Verify formatting
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify module metadata
        if: steps.changes.outputs.heavy == 'true'
        run: go mod tidy -diff

      - name: Vet packages
        if: steps.changes.outputs.heavy == 'true'
        run: go vet ./...

      - name: Scan known vulnerabilities
        if: steps.changes.outputs.heavy == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Test with race detector and coverage
        if: steps.changes.outputs.heavy == 'true'
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce coverage gate
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          total="$(
            go tool cover -func=coverage.out |
              awk '/^total:/ { gsub("%", "", $3); print $3 }'
          )"
          if [[ -z "$total" ]]; then
            echo "::error::Coverage profile has no total."
            exit 1
          fi
          uncovered="$(
            awk 'NR > 1 && $2 > 0 && $3 == 0 { print }' coverage.out
          )"
          if [[ -n "$uncovered" ]]; then
            printf 'coverage %s%% has uncovered statements:\n%s\n' \
              "$total" "$uncovered"
            exit 1
          fi
          printf 'coverage %s%% has no uncovered statements\n' "$total"

      - name: Run dump-to-PostgreSQL end-to-end tests
        if: steps.changes.outputs.heavy == 'true'
        run: >-
          go test -tags=e2e
          -run '^(TestBatchE2E|TestImportExecutionCoordinator)$'
          -count=1
          ./src/batch

      - name: Remove owned test resources and verify no residue
        if: always() && steps.changes.outputs.heavy == 'true'
        shell: bash
        run: scripts/verify-test-docker-cleanup.sh

      - name: Initialize CodeQL
        if: steps.changes.outputs.heavy == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: manual

      - name: Build packages for CodeQL
        if: steps.changes.outputs.heavy == 'true'
        run: |
          go clean -cache
          go build ./...

      - name: Analyze with CodeQL
        if: steps.changes.outputs.heavy == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go
