version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Asia/Seoul
    groups:
      go-dependencies:
        patterns:
          - '*'
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Seoul
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:45'
      timezone: Asia/Seoul
    groups:
      docker-images:
        patterns:
          - '*'
    commit-message:
      prefix: build
      include: scope
