version: 2

project_name: go-open-discogs-batch

before:
  hooks:
    - go mod tidy -diff

builds:
  - main: .
    binary: go-open-discogs-batch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/dsub-io/go-open-discogs-batch/cmd.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else if eq .Os "linux" }}Linux
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^style:'

nfpms:
  - maintainer: state303 <state303@dsub.io>
    description: Import OpenDiscogs data dumps into PostgreSQL.
    homepage: https://github.com/dsub-io/go-open-discogs-batch
    license: MIT
    formats:
      - deb
      - rpm
      - apk
